---
version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4

jobs:
  build:
    parallelism: 1
    docker:
      - image: cimg/ruby:4.0.1-node
    steps:
      # Machine Setup
      - checkout

      - run: gem install bundler -v "$(tail -1 Gemfile.lock | tr -d ' ')"

      - run: bundle config set path 'vendor/bundle'

      - run: 'bundle check || bundle install --jobs=4 --retry=3'

      - run: npm ci

      # build website
      - run: bundle exec middleman build

      - persist_to_workspace:
          root: .
          paths:
            - build
            - vendor/bundle

  # TODO: deploy job disabled after migrating this codebase from
  # cowholio4-website. The old job authenticated to cowholio4's own AWS
  # account/role and synced to cowholio4's production S3 bucket — pointing
  # this repo's CI at real AWS credentials without changing the role ARN
  # and bucket first would overwrite cowholio4.com. Re-enable once a real
  # bucket, OIDC role, and host are configured in config.rb.
  #
  # deploy:
  #   parallelism: 1
  #   docker:
  #     - image: cimg/ruby:4.0.1-node
  #   steps:
  #     - checkout
  #     - attach_workspace:
  #         at: .
  #     - run: gem install bundler -v "$(tail -1 Gemfile.lock | tr -d ' ')"
  #     - run: bundle config set path 'vendor/bundle'
  #     - run: 'bundle check || bundle install --jobs=4 --retry=3'
  #     - run: npm ci
  #     - aws-cli/install
  #     - aws-cli/setup:
  #         role_arn: 'TODO-set-jonong-website-oidc-role-arn'
  #         region: 'us-west-2'
  #     - run: bundle exec middleman s3_sync --environment=build
workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
